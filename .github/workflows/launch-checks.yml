name: Launch checks
on:
  push:
    branches: [revamp/couple-spaces, launch/checks]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-checks-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
